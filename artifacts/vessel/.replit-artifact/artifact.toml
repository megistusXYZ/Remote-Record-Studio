kind = "web"
previewPath = "/"
title = "Vessel"
version = "1.0.0"
id = "artifacts/vessel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19829

[services.development]
run = "pnpm --filter @workspace/vessel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vessel", "run", "build" ]
publicDir = "artifacts/vessel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19829"
BASE_PATH = "/"
