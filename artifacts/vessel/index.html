<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b0f" />
    <meta name="color-scheme" content="dark" />

    <title>Vessel — Studio-Quality Remote Recording. Free, Open, Yours.</title>
    <meta name="description" content="Record studio-quality podcasts and interviews remotely. Free and open-source. Full-quality local recording, you pick where files live, and guests need no account." />
    <meta name="keywords" content="remote recording, podcast recording, studio quality, open source, studio-quality audio, video podcast, riverside alternative, remote interviews, free podcast software" />
    <meta name="author" content="Vessel" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- PWA / iOS standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vessel" />
    <meta name="application-name" content="Vessel" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Open Graph / Facebook / LinkedIn / Slack / Discord / iMessage / SMS -->
    <!-- Single landscape card (1200×630) used uniformly across every platform
         so the rich preview is consistent regardless of where the link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vessel" />
    <meta property="og:title" content="Record Like a Studio. Own It Like Never Before." />
    <meta property="og:description" content="Free, open-source remote recording. Full-quality local capture, you pick where files live, and guests need no account." />
    <meta property="og:image" content="%BASE_URL%og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vessel — Record Like a Studio. Own It Like Never Before. Studio-quality remote recording, free and open-source." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X (always uses landscape card) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Record Like a Studio. Own It Like Never Before." />
    <meta name="twitter:description" content="Free, open-source remote recording. Full-quality local capture, you pick where files live, and guests need no account." />
    <meta name="twitter:image" content="%BASE_URL%og-card.jpg" />
    <meta name="twitter:image:alt" content="Vessel — Studio-quality remote recording. Free and open-source." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />

    <!-- Fonts -->

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Vessel",
      "description": "Studio-quality remote recording for podcasts and interviews. Free and open-source. Full-quality local recording, you pick where files live, and guests need no account.",
      "applicationCategory": "MultimediaApplication",
      "applicationSubCategory": "Audio & Video Recording",
      "operatingSystem": "Web",
      "browserRequirements": "Requires a modern browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Full-quality local recording",
        "Studio-quality remote audio and video",
        "Choose your own storage server",
        "Guests join without creating an account",
        "Open-source"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Deployment settings, written by the web container at start. Loaded
         before the app so modules see them as they evaluate. -->
    <script src="%BASE_URL%config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
