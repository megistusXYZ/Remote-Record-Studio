openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vessel API - studio-quality remote recording platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Recording sessions
  - name: recordings
    description: Saved recordings in the vault
  - name: vault
    description: Vault summary and stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /turn:
    get:
      operationId: getIceServers
      tags: [live]
      summary: ICE servers for the live preview
      description: |
        STUN servers plus, when the operator configured a TURN relay,
        time-limited TURN credentials for the caller. Signed request required;
        the credential is tied to the caller and expires after `ttlSeconds`.
      responses:
        "200":
          description: ICE server list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IceServersResponse"
        "401":
          description: Missing or invalid signed request

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all sessions for the current user
      parameters:
        - name: pubkey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new recording session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by ID
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update session (start/stop recording, change status)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted

  /sessions/{sessionId}/join:
    post:
      operationId: joinSession
      tags: [sessions]
      summary: Join a session as a guest
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionBody"
      responses:
        "200":
          description: Joined session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          description: Room is full — guest cannot join.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomFullError"

  /sessions/{sessionId}/leave:
    post:
      operationId: leaveSession
      tags: [sessions]
      summary: Mark a participant as having left the session
      description: |
        Records a clean exit by stamping `leftAt` on the participant row so
        the canonical roster updates immediately for everyone polling the
        session. Must be signed by the leaving participant's pubkey
        (NIP-98 Authorization header). The host of a session leaving does
        not end the session — that requires PATCH /sessions/{sessionId}
        with status=ended.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveSessionBody"
      responses:
        "200":
          description: Participant marked as left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session or participant not found

  /sessions/{sessionId}/deliveries:
    post:
      operationId: recordDelivery
      tags: [sessions]
      summary: Record this participant's track delivery to the host
      description: |
        Stores a note sealed to the host's key on the sender's device (the
        share link to the sender's archive). The server cannot read it. Must
        be signed by a participant of the session; latest delivery per sender
        wins.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: Delivery recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid body
        "403":
          description: Caller is not a participant of this session
        "404":
          description: Session not found
    get:
      operationId: listDeliveries
      tags: [sessions]
      summary: List track deliveries for a session (host only)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
        "403":
          description: Caller is not the host
        "404":
          description: Session not found

  /recordings:
    get:
      operationId: listRecordings
      tags: [recordings]
      summary: List all recordings in the vault
      parameters:
        - name: pubkey
          in: query
          required: true
          schema:
            type: string
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"
    post:
      operationId: createRecording
      tags: [recordings]
      summary: Save a recording to the vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordingBody"
      responses:
        "201":
          description: Recording saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"

  /recordings/{recordingId}:
    get:
      operationId: getRecording
      tags: [recordings]
      summary: Get a recording by ID
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recording details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          description: Not found
    delete:
      operationId: deleteRecording
      tags: [recordings]
      summary: Delete a recording
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Recording deleted

  /vault/summary:
    get:
      operationId: getVaultSummary
      tags: [vault]
      summary: Get vault summary stats for a user
      parameters:
        - name: pubkey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vault summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSummary"

  /vault/recent:
    get:
      operationId: getRecentActivity
      tags: [vault]
      summary: Get recent recordings and sessions
      parameters:
        - name: pubkey
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivity"

components:
  schemas:
    IceServer:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
            maxLength: 512
        username:
          type: string
          maxLength: 128
        credential:
          type: string
          maxLength: 256
      required:
        - urls

    IceServersResponse:
      type: object
      properties:
        iceServers:
          type: array
          items:
            $ref: "#/components/schemas/IceServer"
        ttlSeconds:
          type: integer
          minimum: 0
          description: Seconds the TURN credential stays valid; 0 when no TURN is configured.
        turnConfigured:
          type: boolean
      required:
        - iceServers
        - ttlSeconds
        - turnConfigured

    DeliveryInput:
      type: object
      properties:
        sealed:
          type: string
          minLength: 1
          maxLength: 16384
          description: NIP-44 ciphertext addressed to the host. Opaque to the server.
      required:
        - sealed

    Delivery:
      type: object
      properties:
        id:
          type: string
        senderPubkey:
          type: string
        sealed:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - senderPubkey
        - sealed
        - createdAt
        - updatedAt

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        nowMs:
          type: integer
          description: Server clock, milliseconds since the Unix epoch. Clients use it to express recording start times on one clock.
      required:
        - status

    Session:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        hostPubkey:
          type: string
        hostName:
          type: string
        status:
          type: string
          enum: [waiting, live, ended]
        inviteCode:
          type: string
        participantCount:
          type: integer
        maxParticipants:
          type: integer
          minimum: 1
          maximum: 25
          description: Maximum number of participants allowed in the room (counts host + guests).
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - hostPubkey
        - hostName
        - status
        - inviteCode
        - participantCount
        - maxParticipants
        - participants
        - createdAt

    CreateSessionBody:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
        hostPubkey:
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        hostName:
          type: string
          maxLength: 80
          minLength: 1
        maxParticipants:
          type: integer
          minimum: 1
          maximum: 25
          description: Optional room size cap chosen by the host. Defaults to 8 if omitted.
      required:
        - title
        - hostPubkey
        - hostName

    UpdateSessionBody:
      type: object
      properties:
        status:
          type: string
          enum: [waiting, live, ended]
        title:
          type: string
          maxLength: 200
          minLength: 1
        maxParticipants:
          type: integer
          minimum: 1
          maximum: 25
          description: New room size cap. Server clamps to be no less than the current participant count.

    RoomFullPublicSession:
      type: object
      description: Minimal public-safe slice of session info returned with a 409 Room Full response so guests can see the host's name without leaking sensitive metadata.
      properties:
        title:
          type: string
        hostName:
          type: string
        participantCount:
          type: integer
        maxParticipants:
          type: integer
      required:
        - title
        - hostName
        - participantCount
        - maxParticipants

    RoomFullError:
      type: object
      description: Returned when a guest tries to join a room that is at its participant cap.
      properties:
        error:
          type: string
          enum: [ROOM_FULL]
        message:
          type: string
        session:
          $ref: "#/components/schemas/RoomFullPublicSession"
      required:
        - error
        - message
        - session

    JoinSessionBody:
      type: object
      properties:
        guestName:
          type: string
          maxLength: 80
          minLength: 1
        guestPubkey:
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
      required:
        - guestName
        - guestPubkey

    LeaveSessionBody:
      type: object
      description: |
        Body for POST /sessions/{sessionId}/leave. The pubkey must match the
        signing pubkey of the NIP-98 Authorization header so participants
        can only mark themselves as left.
      properties:
        pubkey:
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
      required:
        - pubkey

    Participant:
      type: object
      properties:
        id:
          type: string
        pubkey:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [host, guest]
        joinedAt:
          type: string
          format: date-time
        leftAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Timestamp of clean exit via POST /sessions/{sessionId}/leave.
            Null while the participant is in the room. Consumers building
            the live roster should filter rows where this is non-null.
      required:
        - id
        - pubkey
        - displayName
        - role
        - joinedAt

    Recording:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
          nullable: true
        sessionTitle:
          type: string
          nullable: true
        ownerPubkey:
          type: string
        participantName:
          type: string
        durationSeconds:
          type: integer
        sizeBytes:
          type: integer
        mimeType:
          type: string
        blobHash:
          type: string
          nullable: true
        blobUrl:
          type: string
          nullable: true
        audioBlobHash:
          type: string
          nullable: true
        audioBlobUrl:
          type: string
          nullable: true
        audioSizeBytes:
          type: integer
          nullable: true
        audioMimeType:
          type: string
          nullable: true
        videoBlobHash:
          type: string
          nullable: true
        videoBlobUrl:
          type: string
          nullable: true
        videoSizeBytes:
          type: integer
          nullable: true
        videoMimeType:
          type: string
          nullable: true
        screenBlobHash:
          type: string
          nullable: true
        screenBlobUrl:
          type: string
          nullable: true
        screenSizeBytes:
          type: integer
          nullable: true
        screenMimeType:
          type: string
          nullable: true
        screenDurationSeconds:
          type: integer
          nullable: true
        status:
          type: string
          enum: [processing, ready, error]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ownerPubkey
        - participantName
        - durationSeconds
        - sizeBytes
        - mimeType
        - status
        - createdAt

    CreateRecordingBody:
      type: object
      properties:
        sessionId:
          type: string
          nullable: true
          maxLength: 128
        sessionTitle:
          type: string
          nullable: true
          maxLength: 200
        ownerPubkey:
          type: string
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        participantName:
          type: string
          maxLength: 80
          minLength: 1
        durationSeconds:
          type: integer
          minimum: 0
        sizeBytes:
          type: integer
          minimum: 0
        mimeType:
          type: string
          maxLength: 100
        blobHash:
          type: string
          nullable: true
          maxLength: 64
        blobUrl:
          type: string
          nullable: true
          maxLength: 2048
        audioBlobHash:
          type: string
          nullable: true
          maxLength: 64
        audioBlobUrl:
          type: string
          nullable: true
          maxLength: 2048
        audioSizeBytes:
          type: integer
          nullable: true
        audioMimeType:
          type: string
          nullable: true
          maxLength: 100
        videoBlobHash:
          type: string
          nullable: true
          maxLength: 64
        videoBlobUrl:
          type: string
          nullable: true
          maxLength: 2048
        videoSizeBytes:
          type: integer
          nullable: true
        videoMimeType:
          type: string
          nullable: true
          maxLength: 100
        screenBlobHash:
          type: string
          nullable: true
          maxLength: 64
        screenBlobUrl:
          type: string
          nullable: true
          maxLength: 2048
        screenSizeBytes:
          type: integer
          nullable: true
        screenMimeType:
          type: string
          nullable: true
          maxLength: 100
        screenDurationSeconds:
          type: integer
          nullable: true
        status:
          type: string
          enum: [processing, ready, error]
      required:
        - ownerPubkey
        - participantName
        - durationSeconds
        - sizeBytes
        - mimeType
        - status

    VaultSummary:
      type: object
      properties:
        totalRecordings:
          type: integer
        totalDurationSeconds:
          type: integer
        totalSizeBytes:
          type: integer
        totalSessions:
          type: integer
        recordingsThisMonth:
          type: integer
      required:
        - totalRecordings
        - totalDurationSeconds
        - totalSizeBytes
        - totalSessions
        - recordingsThisMonth

    RecentActivity:
      type: object
      properties:
        recentRecordings:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
      required:
        - recentRecordings
        - recentSessions
