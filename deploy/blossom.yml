# Vessel storage server (blossom-server). Mounted read-only at /app/config.yml.
# ${VARIABLES} are substituted from the container environment at start.
#
# Locked to what Vessel uploads: recordings encrypted on the participant's
# device, which arrive as opaque bytes. Anyone can make a key to sign an
# upload, so the server refuses every other type (it would otherwise be free
# public hosting), never fetches from other servers, and caps file size.
# Nobody can list anyone else's files, and files unaccessed for a year are
# pruned. Data lives in the blossom-data volume; switch `storage.backend` to
# s3 for a bucket. Checked by scripts/src/deploy-storage.test.ts.

publicDomain: "${BLOSSOM_PUBLIC_DOMAIN}"

database:
  path: data/sqlite.db

dashboard:
  enabled: false

storage:
  backend: local
  local:
    dir: ./data/blobs
  removeWhenNoOwners: false
  # The only accepted type, and its expiry.
  rules:
    - type: application/octet-stream
      expiration: 1 year

upload:
  enabled: true
  requireAuth: true
  requirePubkeyInRule: false
  # 4 GiB: fits Vessel's largest file, a three-hour stereo WAV master (~3.1 GB).
  maxSize: 4294967296

# Vessel never asks the server to fetch a file or transcode media.
mirror:
  enabled: false

media:
  enabled: false

list:
  enabled: true
  requireAuth: true
  allowListOthers: false
