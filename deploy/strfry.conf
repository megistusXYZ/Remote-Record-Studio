# Vessel sync server (strfry). Mounted at /etc/strfry.conf.
#
# Edit relay.info to name your deployment. Everything else is a sane default
# for one VPS. The database lives in the strfry-db volume.

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Caddy proxies to this port on the internal network.
    bind = "0.0.0.0"
    port = 7777
    # 0: do not try to raise the open-file limit (compose sets it).
    nofiles = 0
    # Caddy sets this; strfry logs and limits by the visitor's address.
    realIpHeader = "X-Forwarded-For"

    info {
        name = "Vessel sync server"
        description = "Sync server for a Vessel studio deployment."
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = false
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
