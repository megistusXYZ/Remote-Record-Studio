name: Images

# Builds the two production images (deploy/api.Dockerfile, deploy/web.Dockerfile).
#
#   pull requests   build only, linux/amd64, to catch a broken Dockerfile
#   push to main    build and push :main, :latest and :sha-<short>
#   release tags    build and push :<version>, :<major>.<minor>
#
# Images land in GitHub Container Registry under this repository's owner:
#   ghcr.io/<owner>/remote-record-studio-api
#   ghcr.io/<owner>/remote-record-studio-web
# deploy/compose.yaml pulls them by default (VESSEL_IMAGE_PREFIX / _TAG).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Registry paths must be lowercase; the repository owner may not be.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remote-record-studio-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 builds on pushes)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
